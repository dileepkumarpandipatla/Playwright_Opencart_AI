
# =============================================================================
# Docker Compose - Playwright + TypeScript Automation Framework
# =============================================================================

services:

  playwright-tests:

    build:
      context: .
      dockerfile: Dockerfile

    image: playwright-opencart

    working_dir: /app

    # Jenkins-generated environment variables
    env_file:
      - .env

    environment:
      CI: "1"

    # Persist reports on Jenkins workspace
    volumes:
      - ./reports:/app/reports
      - ./allure-results:/app/allure-results
      - ./allure-report:/app/allure-report
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results

    # Default suite
    command: ["all"]
