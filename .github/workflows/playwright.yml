
# To run manually: go to your repo → Actions → Playwright Tests → Run workflow → choose your parameters → Run.

name: 🎭 Playwright Tests

on:
  push:
    branches: [master]

  pull_request:
    branches: [master]

  workflow_dispatch:
    inputs:
      test_suite:
        description: "Select test suite"
        type: choice
        options:
          - test:master
          - test:sanity
          - test:regression
          - test:e2e
          - test:api
          - test:web
          - test:datadriven
        default: "test:e2e"

      browser:
        description: "Select browser"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
        default: "chromium"

      mode:
        description: "Run mode"
        type: choice
        options:
          - headless
          - headed
        default: "headless"

jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:

      # ==================================================
      # 📥 1. CHECKOUT REPOSITORY
      # ==================================================

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ==================================================
      # 🟢 2. SETUP NODE.JS
      # ==================================================

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ==================================================
      # 📦 3. INSTALL DEPENDENCIES
      # ==================================================

      - name: 📦 Install Dependencies
        run: npm ci

      # ==================================================
      # 🎭 4. INSTALL PLAYWRIGHT BROWSERS
      # ==================================================

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps

      # ==================================================
      # 🔐 5. CREATE .ENV FILE WITH GITHUB SECRETS
      # ==================================================

      - name: ⚙️ Create .env File
        shell: pwsh
        env:
          APP_EMAIL: ${{ secrets.APP_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          Copy-Item .env.example .env

          $values = @{
            "APP_EMAIL"      = $env:APP_EMAIL
            "APP_PASSWORD"   = $env:APP_PASSWORD
            "PASSWORD"       = $env:API_PASSWORD
            "ADMIN_USERNAME" = $env:ADMIN_USERNAME
            "ADMIN_PASSWORD" = $env:ADMIN_PASSWORD
            "DB_PASSWORD"    = $env:DB_PASSWORD
          }

          $lines = Get-Content .env

          $updatedLines = foreach ($line in $lines) {
            $matched = $false

            foreach ($key in $values.Keys) {
              if ($line -match "^$([regex]::Escape($key))=") {
                $matched = $true
                "$key=$($values[$key])"
                break
              }
            }

            if (-not $matched) {
              $line
            }
          }

          Set-Content -Path .env -Value $updatedLines -Encoding utf8

      # ==================================================
      # 🧪 6. RUN PLAYWRIGHT TESTS
      # ==================================================

      - name: 🧪 Run Playwright Tests
        shell: pwsh
        run: |
          $suite = "${{ github.event.inputs.test_suite || 'test:e2e' }}"
          $browser = "${{ github.event.inputs.browser || 'chromium' }}"
          $mode = "${{ github.event.inputs.mode || 'headless' }}"

          $tag = $suite -replace 'test:', ''
          $browserFlag = "--project=$browser"
          $modeFlag = if ($mode -eq 'headed') { '--headed' } else { '' }

          Write-Host "Selected Suite : $suite"
          Write-Host "Selected Tag   : @$tag"
          Write-Host "Browser        : $browser"
          Write-Host "Mode           : $mode"

          npx playwright test --grep "@$tag" $browserFlag $modeFlag --output=test-results
        env:
          CI: "1"

      # ==================================================
      # ☕ 7. SETUP JAVA FOR ALLURE
      # ==================================================

      - name: ☕ Setup Java
        if: always() && hashFiles('test-results/allure/results/**') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==================================================
      # 📊 8. GENERATE ALLURE HTML REPORT
      # ==================================================

      - name: 📊 Generate Allure Report
        if: always() && hashFiles('test-results/allure/results/**') != ''
        run: npx allure generate test-results/allure/results --clean -o test-results/allure/report

      # ==================================================
      # 📤 9. UPLOAD PLAYWRIGHT HTML REPORT
      # ==================================================

      - name: 📊 Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/playwright/
          if-no-files-found: warn
          retention-days: 30

      # ==================================================
      # 📋 10. UPLOAD CUSTOM REPORT
      # ==================================================

      - name: 📋 Upload Custom Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-report
          path: test-results/custom/
          if-no-files-found: warn
          retention-days: 30

      # ==================================================
      # 📈 11. UPLOAD ALLURE RESULTS
      # ==================================================

      - name: 📈 Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: test-results/allure/results/
          if-no-files-found: warn
          retention-days: 30

      # ==================================================
      # 🌐 12. UPLOAD ALLURE REPORT TO GITHUB PAGES
      # ==================================================

      - name: 🌐 Upload Allure Report
        if: always() && github.event_name != 'pull_request' && hashFiles('test-results/allure/report/**') != ''
        uses: actions/upload-pages-artifact@v4
        with:
          path: test-results/allure/report

      # ==================================================
      # 🚀 13. DEPLOY ALLURE REPORT
      # ==================================================

      - name: 🚀 Deploy Allure Report
        if: always() && github.event_name != 'pull_request' && hashFiles('test-results/allure/report/**') != ''
        id: deployment
        uses: actions/deploy-pages@v4

      # ==================================================
      # 🔗 14. DISPLAY SHAREABLE ALLURE URL
      # ==================================================

      - name: 🔗 Display Allure Report URL
        if: always() && steps.deployment.outputs.page_url != ''
        shell: pwsh
        run: |
          $url = "${{ steps.deployment.outputs.page_url }}"

          Write-Host "Allure Report URL: $url"

          "### 📊 Allure Test Report" >> $env:GITHUB_STEP_SUMMARY
          "[$url]($url)" >> $env:GITHUB_STEP_SUMMARY
