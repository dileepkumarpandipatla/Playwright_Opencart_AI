
# ==================================================
# 🚀 1. WORKFLOW NAME
# ==================================================

name: Playwright Automation Tests

# ==================================================
# 🎯 2. WORKFLOW TRIGGERS
# ==================================================

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:
    inputs:
      test_suite:
        description: "Select Test Suite"
        required: true
        type: choice
        default: "test:e2e"
        options:
          - test:master
          - test:sanity
          - test:regression
          - test:e2e
          - test:api
          - test:web
          - test:datadriven

      browser:
        description: "Select Browser"
        required: true
        type: choice
        default: "chromium"
        options:
          - chromium
          - firefox
          - webkit

      mode:
        description: "Select Browser Execution Mode"
        required: true
        type: choice
        default: "headless"
        options:
          - headless
          - headed

# ==================================================
# ⚙️ 3. JOB CONFIGURATION
# ==================================================

jobs:
  playwright-tests:
    name: Playwright Tests

    runs-on: windows-latest
    timeout-minutes: 60

    permissions:
      contents: read

    # ==================================================
    # 🔐 4. ENVIRONMENT VARIABLES & SECRETS
    # ==================================================

    env:
      CI: true

      SELECTED_SUITE: ${{ inputs.test_suite }}
      SELECTED_BROWSER: ${{ inputs.browser }}
      SELECTED_MODE: ${{ inputs.mode }}

      APP_EMAIL: ${{ secrets.APP_EMAIL }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      API_PASSWORD: ${{ secrets.API_PASSWORD }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:

      # ==================================================
      # 📥 5. CHECKOUT SOURCE CODE
      # ==================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==================================================
      # 🟢 6. SETUP NODE.JS
      # ==================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ==================================================
      # 📦 7. INSTALL PROJECT DEPENDENCIES
      # ==================================================

      - name: Install Dependencies
        run: npm ci

      # ==================================================
      # 🌐 8. INSTALL PLAYWRIGHT BROWSERS
      # ==================================================

      - name: Install Playwright Browsers
        run: npx playwright install

      # ==================================================
      # 🔑 9. CREATE ENVIRONMENT FILE
      # ==================================================

      - name: Create .env File
        shell: pwsh
        run: |
          Copy-Item .env.example .env

          $values = @{
            "APP_EMAIL"      = $env:APP_EMAIL
            "APP_PASSWORD"   = $env:APP_PASSWORD
            "PASSWORD"       = $env:API_PASSWORD
            "ADMIN_USERNAME" = $env:ADMIN_USERNAME
            "ADMIN_PASSWORD" = $env:ADMIN_PASSWORD
            "DB_PASSWORD"    = $env:DB_PASSWORD
          }

          $lines = Get-Content .env

          $updatedLines = foreach ($line in $lines) {
            $matched = $false

            foreach ($key in $values.Keys) {
              if ($line -match "^$([regex]::Escape($key))=") {
                $matched = $true
                "$key=$($values[$key])"
                break
              }
            }

            if (-not $matched) {
              $line
            }
          }

          Set-Content -Path .env -Value $updatedLines -Encoding utf8

      # ==================================================
      # 🧪 10. SELECT & EXECUTE TEST SUITE
      # ==================================================

      - name: Run Playwright Tests
        shell: pwsh
        run: |
          $suite = $env:SELECTED_SUITE
          $browser = $env:SELECTED_BROWSER
          $mode = $env:SELECTED_MODE

          # Default values for automatic push and pull request runs
          if ([string]::IsNullOrWhiteSpace($suite)) {
            $suite = "test:master"
          }

          if ([string]::IsNullOrWhiteSpace($browser)) {
            $browser = "chromium"
          }

          if ([string]::IsNullOrWhiteSpace($mode)) {
            $mode = "headless"
          }

          # Extract tag name
          $tag = $suite -replace "^test:", ""

          Write-Host "Selected Test Suite : $suite"
          Write-Host "Selected Browser    : $browser"
          Write-Host "Execution Mode      : $mode"

          # Build Playwright command
          $playwrightArgs = @(
            "test",
            "--grep",
            "@$tag",
            "--project=$browser"
          )

          if ($mode -eq "headed") {
            $playwrightArgs += "--headed"
          }

          npx playwright @playwrightArgs

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # ==================================================
      # ☕ 11. SETUP JAVA FOR ALLURE
      # ==================================================

      - name: Setup Java
        if: always() && hashFiles('test-results/allure/results/**') != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==================================================
      # 📊 12. GENERATE ALLURE HTML REPORT
      # ==================================================

      - name: Generate Allure Report
        if: always() && hashFiles('test-results/allure/results/**') != ''
        run: npx allure generate test-results/allure/results --clean -o test-results/allure/report

      # ==================================================
      # 📤 13. UPLOAD TEST REPORTS
      # ==================================================

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-reports
          path: test-results/
          if-no-files-found: warn
          retention-days: 30
