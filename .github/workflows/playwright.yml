
# To run manually: go to your repo → Actions → Playwright Tests → Run workflow → choose your parameters → Run.

name: 🎭 Playwright Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      test_suite:
        description: "Select test suite"
        type: choice
        options:
          - test:master
          - test:sanity
          - test:regression
          - test:e2e
          - test:api
          - test:web
          - test:datadriven
        default: "test:web"
      browser:
        description: "Select browser"
        type: choice
        options:
          - chromium
          - firefox
          - webkit
        default: "chromium"
      mode:
        description: "Run mode"
        type: choice
        options:
          - headless
          - headed
        default: "headless"

jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: ⚙️ Create .env File
        shell: pwsh
        run: |
          Copy-Item .env.example .env

          $envContent = Get-Content .env -Raw

          $envContent = $envContent -replace '(?m)^APP_EMAIL=.*$', "APP_EMAIL=$env:APP_EMAIL"
          $envContent = $envContent -replace '(?m)^APP_PASSWORD=.*$', "APP_PASSWORD=$env:APP_PASSWORD"
          $envContent = $envContent -replace '(?m)^PASSWORD=.*$', "PASSWORD=$env:API_PASSWORD"
          $envContent = $envContent -replace '(?m)^DB_PASSWORD=.*$', "DB_PASSWORD=$env:DB_PASSWORD"
          $envContent = $envContent -replace '(?m)^ADMIN_USERNAME=.*$', "ADMIN_USERNAME=$env:ADMIN_USERNAME"
          $envContent = $envContent -replace '(?m)^ADMIN_PASSWORD=.*$', "ADMIN_PASSWORD=$env:ADMIN_PASSWORD"

          Set-Content -Path .env -Value $envContent -Encoding utf8
        env:
          APP_EMAIL: ${{ secrets.APP_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

      - name: 🧪 Run Playwright Tests
        shell: pwsh
        run: |
          $suite = "${{ github.event.inputs.test_suite || 'test:web' }}"
          $browser = "${{ github.event.inputs.browser || 'chromium' }}"
          $mode = "${{ github.event.inputs.mode || 'headless' }}"
          $tag = $suite -replace 'test:', ''
          $browserFlag = "--project=$browser"
          $modeFlag = if ($mode -eq 'headed') { '--headed' } else { '' }
          npx playwright test --grep "@$tag" $browserFlag $modeFlag --output=test-results
        env:
          CI: "1"

      - name: 📈 Generate Allure HTML Report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: 📊 Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: 📋 Upload JUnit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: junit-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: 📈 Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: 📁 Upload Allure Raw Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 30
          if-no-files-found: ignore
